<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>호퍼 적재소 시제품</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
body { margin:0; background:#0E1B2C; color:#E8EEF4; font-family:"Noto Sans KR", system-ui, sans-serif; }
.page { max-width:1200px; margin:0 auto; padding:20px 16px 40px; display:flex; flex-direction:column; gap:14px; }
a { color:#FFC233; }
h1 { font-size:24px; margin:0; } p { margin:0; color:#A9B7C6; }
#wrap { position:relative; width:100%; overflow:hidden; border-radius:6px; background:#17407F; }
#stage { --sans:"Noto Sans KR", system-ui, sans-serif; position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden; }
#stage .layer { position:absolute; inset:0; }
.bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.bar input { flex:1; min-width:160px; accent-color:#FFC233; }
button { font:inherit; font-size:14px; background:#1C2E45; color:#E8EEF4; border:1px solid #3A5272; border-radius:4px; padding:6px 12px; cursor:pointer; }
button.on { border-color:#FFC233; color:#FFC233; }
#chips { display:flex; gap:6px; flex-wrap:wrap; }
#clock { font-variant-numeric:tabular-nums; font-size:14px; color:#A9B7C6; }
#stage { --ground:#17407F; --main:#3FAE6A; --second:#F2F7FC; --accent:#FFC233; color:var(--second); font-family:var(--sans, system-ui, sans-serif);
  --faint:color-mix(in srgb, var(--second) 12%, transparent); --fainter:color-mix(in srgb, var(--second) 6%, transparent); --yedge:color-mix(in srgb, var(--accent) 55%, var(--ground));
  --wall:color-mix(in srgb, var(--main) 55%, var(--ground)); --rod:color-mix(in srgb, var(--main) 75%, var(--ground)); --ball:color-mix(in srgb, var(--ground) 55%, var(--second)); --card:color-mix(in srgb, var(--accent) 22%, var(--ground)); --rice:var(--second) }
.ground { position:absolute; inset:0; background:linear-gradient(var(--faint) 2px, transparent 2px) 0 0/160px 160px, linear-gradient(90deg, var(--faint) 2px, transparent 2px) 0 0/160px 160px, linear-gradient(var(--fainter) 1px, transparent 1px) 0 0/32px 32px, linear-gradient(90deg, var(--fainter) 1px, transparent 1px) 0 0/32px 32px, var(--ground) }
.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:14px } .words > * { margin:0 }
.line { font-size:54px; line-height:1.18; font-weight:700 } .sub { font-size:30px; line-height:1.4; color:color-mix(in srgb, var(--second) 78%, var(--ground)) }
.step { font-size:30px; line-height:1.2; color:var(--accent); font-weight:700; letter-spacing:.04em }
.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }
.ln { fill:none; stroke:var(--second); stroke-width:3; stroke-linecap:round; stroke-linejoin:round }
.dash { fill:none; stroke:var(--second); stroke-width:2; stroke-dasharray:12 9; opacity:.55 }
.tag { position:absolute; font-size:28px; line-height:1.3; padding:8px 16px; border:2px solid var(--second); color:var(--second); background:color-mix(in srgb, var(--ground) 90%, transparent); max-width:600px }
.tag.hot { border-color:var(--accent); color:var(--accent) }
.sheet { position:absolute; right:48px; bottom:36px; border:2px solid var(--second); font-size:22px; line-height:1.3; display:flex; flex-direction:column; background:var(--ground); opacity:.85 }
.sheet > div { padding:6px 18px } .sheet > div + div { border-top:2px solid var(--second) }
</style>
</head>
<body>
<div class="page">
  <p><a href="./">← 호퍼 적재소 기획</a></p>
  <h1>호퍼 적재소 시제품</h1>
  <p>기어서 들어와 일어서면 열리고, 앞으로 지나가면 닫히는 호퍼 (옆·위·앞에서 본 모습) · 소리 없음 · Space 재생/일시정지</p>
  <div id="wrap"><div id="stage"></div></div>
  <div class="bar"><button id="play" type="button">재생</button><input id="seek" type="range" min="0" value="0" aria-label="재생 위치"><span id="clock"></span></div>
  <div id="chips"></div>
</div>
<script src="player.js"></script>
<script>
(function () {
// Side view, 1 cm = 32 px, floor y = 900. Hopper mouth 18.5 cm (chopsticks included), rod tip 11 cm, rod at x = 1000.
// Robot local origin = top of its back (= bucket floor), centre of the bucket.
window.W = {
  CM: 32, FLOOR: 900, RX: 1000, TIP: 900 - 11 * 32, MOUTH: 900 - 18.5 * 32,
  floor() {
    return '<path class="ln" d="M40 900 H1880"/><path class="ln" style="stroke-width:1.5;opacity:.4" d="' + Array.from({ length: 46 }, (_, i) => 'M' + (70 + i * 40) + ' 900 l-18 18').join(' ') + '"/>';
  },
  hopper(cls) {
    // Mouth rests on two chopsticks (0.5 cm) laid across two side boxes (18 cm): mouth at 18.5 cm = y 308.
    const glass = 'M962 300 L962 230 Q962 192 884 152 L884 -20 M1038 300 L1038 230 Q1038 192 1116 152 L1116 -20';
    return '<g class="' + cls + '-boxes"><rect x="896" y="324" width="208" height="576" style="fill:var(--card);opacity:.35"/><rect class="dash" x="896" y="324" width="208" height="576"/></g>' +
      '<path d="M966 230 Q966 194 888 156 L888 40 L1112 40 L1112 156 Q1034 194 1034 230 Z" style="fill:var(--rice);opacity:.85"/>' +
      '<path d="M888 40 Q940 28 1000 40 T1112 36" style="fill:none;stroke:color-mix(in srgb, var(--rice) 60%, var(--ground));stroke-width:2"/>' +
      '<g class="' + cls + '-mv"><rect x="993" y="186" width="14" height="354" rx="5" style="fill:var(--rod)"/><path d="M993 536 L1000 548 L1007 536 Z" style="fill:var(--rod)"/>' +
        '<circle cx="1000" cy="184" r="60" style="fill:var(--ball)"/><circle cx="980" cy="164" r="16" style="fill:var(--second);opacity:.35"/></g>' +
      '<path d="' + glass + '" style="fill:none;stroke:var(--second);stroke-width:4;stroke-linejoin:round"/>' +
      '<rect x="948" y="300" width="104" height="10" rx="3" style="fill:var(--second)"/>' +
      '<circle cx="944" cy="316" r="8" style="fill:color-mix(in srgb, var(--accent) 45%, var(--second))"/><circle cx="1056" cy="316" r="8" style="fill:color-mix(in srgb, var(--accent) 45%, var(--second))"/>';
  },
  robot(cls) {
    const leg = (n, far) => '<g class="' + cls + '-' + n + '"' + (far ? ' style="opacity:.5"' : '') + '><path style="fill:none;stroke:rgba(0,0,0,.35);stroke-width:32;stroke-linecap:round;stroke-linejoin:round"/><path style="fill:none;stroke:var(--accent);stroke-width:24;stroke-linecap:round;stroke-linejoin:round"/><circle r="9" style="fill:var(--yedge)"/></g>';
    const back = '<g class="' + cls + '-back">' + leg('lf2', true) + leg('lr2', true) +
      '<path d="M-290 112 L-290 14 Q-290 0 -276 0 L236 0 Q250 0 250 14 L250 112 Z" style="fill:var(--accent);stroke:var(--yedge);stroke-width:3"/>' +
      '<path d="M-250 22 L-200 92 L-150 22 M-110 22 L-60 92 L-10 22 M30 22 L80 92 L130 22" style="fill:none;stroke:var(--yedge);stroke-width:3"/>' +
      '<circle cx="-230" cy="104" r="20" style="fill:var(--yedge)"/><circle cx="190" cy="104" r="20" style="fill:var(--yedge)"/>' +
      '<rect x="236" y="-16" width="170" height="150" rx="12" style="fill:var(--ground)"/><rect x="236" y="-16" width="170" height="150" rx="12" style="fill:rgba(0,0,0,.45)"/>' +
      '<circle cx="322" cy="56" r="30" style="fill:color-mix(in srgb, var(--second) 10%, var(--ground));stroke:var(--second);stroke-width:3"/><circle cx="322" cy="56" r="9" style="fill:var(--second);opacity:.5"/>' +
      '<rect x="-224" y="-64" width="448" height="64" style="fill:var(--wall)"/>' +
      '<path class="' + cls + '-pile" d="M0 0 Z" style="fill:var(--rice)"/>' +
      '<rect x="-232" y="-6" width="464" height="8" style="fill:var(--main)"/><rect x="216" y="-40" width="10" height="40" style="fill:var(--main)"/>' +
      '<path d="M-232 0 L-252 10" style="stroke:var(--main);stroke-width:7;stroke-linecap:round"/></g>';
    const front = '<g class="' + cls + '-front"><rect x="-224" y="-64" width="448" height="64" style="fill:var(--main);opacity:.55"/>' +
      '<path d="M-224 -64 H224" style="stroke:var(--main);stroke-width:5"/>' + leg('lf') + leg('lr') + '</g>';
    return { back, front };
  },
  rig(stage, cls) {
    const b = stage.querySelector('.' + cls + '-back'), f = stage.querySelector('.' + cls + '-front');
    const L = [['lf', 190, 0], ['lr', -230, Math.PI], ['lf2', 204, Math.PI], ['lr2', -216, 0]].map(([n, hx, ph]) => {
      const g = stage.querySelector('.' + cls + '-' + n);
      return { p: Array.from(g.querySelectorAll('path')), c: g.querySelector('circle'), hx, ph };
    });
    const pile = stage.querySelector('.' + cls + '-pile'), LL = 140;
    return {
      place(x, t, walk, s) {
        const by = W.FLOOR - (8.5 + 3 * s) * W.CM, F = W.FLOOR - by;
        const tr = 'translate(' + x.toFixed(1) + ' ' + by.toFixed(1) + ')';
        b.setAttribute('transform', tr); f.setAttribute('transform', tr);
        for (const l of L) {
          const ph = 2 * Math.PI * 1.6 * t + l.ph, fx = l.hx + walk * 36 * Math.cos(ph), fy = F - walk * 18 * Math.max(0, Math.sin(ph));
          const dx = fx - l.hx, dy = fy - 104, d = Math.min(Math.hypot(dx, dy), 2 * LL - 1), a = Math.atan2(dy, dx), k = Math.acos(d / (2 * LL));
          const kx = l.hx + LL * Math.cos(a + k), ky = 104 + LL * Math.sin(a + k);
          const path = 'M' + l.hx + ' 104 L' + kx.toFixed(1) + ' ' + ky.toFixed(1) + ' L' + fx.toFixed(1) + ' ' + fy.toFixed(1);
          l.p.forEach((p) => p.setAttribute('d', path));
          l.c.setAttribute('cx', kx.toFixed(1)); l.c.setAttribute('cy', ky.toFixed(1));
        }
        return by;
      },
      pile(v, cx) {
        cx = cx || 0;
        const w = 20 + 150 * v, h = 4 + 44 * v;
        pile.setAttribute('d', v <= 0 ? 'M0 0 Z' : 'M' + (cx - w).toFixed(1) + ' 0 Q' + cx.toFixed(1) + ' ' + (-2 * h).toFixed(1) + ' ' + (cx + w).toFixed(1) + ' 0 Z');
        return h;
      },
    };
  },
  // How far the bucket floor pushes the rod up (negative = up), given robot x and back height.
  push(x, by) {
    const lx = W.RX - x;
    return lx >= -224 && lx <= 224 && by < W.TIP ? by - W.TIP : 0;
  },
  dim(x1, y1, x2, y2) {
    const a = Math.atan2(y2 - y1, x2 - x1), nx = -Math.sin(a) * 12, ny = Math.cos(a) * 12;
    const tk = (x, y) => ' M' + (x - nx).toFixed(1) + ' ' + (y - ny).toFixed(1) + ' L' + (x + nx).toFixed(1) + ' ' + (y + ny).toFixed(1);
    return '<path class="ln" style="stroke-width:2;stroke:var(--accent)" d="M' + x1 + ' ' + y1 + ' L' + x2 + ' ' + y2 + tk(x1, y1) + tk(x2, y2) + '"/>';
  },
  grains(kit, n, seed) {
    const r = kit.rng(seed), list = Array.from({ length: n }, () => ({ at: r(), j: r() - 0.5, s: 4 + r() * 4 }));
    return {
      markup: '<g class="grains">' + list.map(() => '<ellipse style="fill:var(--rice)"/>').join('') + '</g>',
      bind(g) { list.forEach((p, i) => { p.el = g.children[i]; p.el.setAttribute('rx', (p.s * 0.6).toFixed(1)); p.el.setAttribute('ry', p.s.toFixed(1)); }); },
      fall(t, y0, ys, P, on) {
        for (const p of list) {
          const qq = (((t - p.at * P) / P) % 1 + 1) % 1, born = t - qq * P;
          p.el.style.opacity = on(born) ? 1 : 0;
          p.el.setAttribute('cx', (W.RX + 14 * Math.sign(p.j) + p.j * 26 + p.j * 30 * qq).toFixed(1));
          p.el.setAttribute('cy', (y0 + (ys - y0) * qq * qq).toFixed(1));
        }
      },
    };
  },
};
})();
</script>
<script>
(function () {
const { seg, eo, eio, lerp, TextFx } = kit;
kit.scene('parts', {
  init(kit) {
    const H = W.hopper('parts-h'), cut = H.indexOf('</g>') + 4, R = W.robot('parts-r');
    kit.stage.append(kit.h('<div class="ground">' +
      '<svg class="art parts-art" viewBox="0 0 1920 1080">' + W.floor() + H.slice(0, cut) + R.back + H.slice(cut) + R.front +
        '<g class="parts-dims"><path class="dash" d="M944 308 H620 M1007 548 H1520"/>' + W.dim(640, 308, 640, 900) + W.dim(1150, 308, 1150, 548) + W.dim(1500, 548, 1500, 900) + '</g></svg>' +
      '<div class="words" style="left:90px;top:70px;width:740px"><p class="step">호퍼 적재소 · 1차 시제품</p><h1 class="line parts-line" style="font-size:64px">막대 하나로 여닫는 호퍼</h1><p class="sub parts-sub">기어서 들어와 일어서면 열리고, 지나가면 닫힌다</p></div>' +
      '<div class="tag parts-t" style="left:1180px;top:100px">페트병 + 파란 공 (마개)</div>' +
      '<div class="tag parts-t" style="left:1200px;top:450px">초록 막대 (볼펜대)</div>' +
      '<div class="tag parts-t" style="right:1040px;top:330px">양옆 상자 + 나무젓가락 2개로 걸침</div>' +
      '<div class="tag hot parts-t" style="right:1040px;top:396px">상자 안쪽 간격 24 cm (로봇 폭의 약 2배)</div>' +
      '<div class="tag parts-t" style="right:1150px;top:470px">과자 상자 버켓 (등 위)</div>' +
      '<div class="tag hot parts-d" style="left:520px;top:570px">18.5 cm</div>' +
      '<div class="tag hot parts-d" style="left:1166px;top:380px">7.5 cm</div>' +
      '<div class="tag hot parts-d" style="left:1520px;top:690px">11 cm</div>' +
      '<div class="sheet"><div>dogistics · 호퍼 적재소</div><div>SHEET 0 · 구성</div></div></div>'));
    const q = (s) => kit.stage.querySelector(s);
    this.rig = W.rig(kit.stage, 'parts-r');
    this.tags = Array.from(kit.stage.querySelectorAll('.parts-t'));
    this.dl = Array.from(kit.stage.querySelectorAll('.parts-d'));
    Object.assign(this, { art: q('.parts-art'), dims: q('.parts-dims'), line: q('.parts-line'), sub: q('.parts-sub') });
  },
  render(t) {
    this.art.style.transform = 'scale(' + lerp(1, 1.02, eio(seg(t, 0, 4))) + ')';
    this.rig.place(1000, t, 0, 0);
    this.rig.pile(0);
    TextFx.fadeFromRight(this.line, t, -0.6);
    this.sub.style.opacity = eo(seg(t, 0.1, 0.6));
    this.tags.forEach((el, i) => { const p = eo(seg(t, 0.5 + i * 0.25, 0.9 + i * 0.25)); el.style.opacity = p; el.style.transform = 'translateY(' + lerp(12, 0, p).toFixed(1) + 'px)'; });
    const d = eo(seg(t, 1.6, 2.1));
    this.dims.style.opacity = d;
    this.dl.forEach((el, i) => { el.style.opacity = eo(seg(t, 1.8 + i * 0.2, 2.2 + i * 0.2)); });
  },
});
})();
</script>
<script>
(function () {
const { seg, eo, ei, eio, lerp, TextFx } = kit;
// Top view, 1 cm = 24 px. Hopper centre (960, 540). Robot heads up the screen; its origin is where the rod meets the bucket.
const TOP_Y = (t) => lerp(1420, 540, eio(seg(t, -0.2, 3.4))) - 1100 * ei(seg(t, 5.6, 8.2));
const TOP_X = (t) => 960 + 16 * Math.sin(t * 1.4) * (1 - seg(t, 2.6, 3.4)) + 10 * Math.sin(t * 1.1) * seg(t, 5.6, 6.4);
Object.assign(W, {
  topBot(cls) {
    const leg = (x, y) => '<rect class="' + cls + '-leg" x="' + (x - 16) + '" y="' + (y - 26) + '" width="32" height="52" rx="10" style="fill:var(--accent);stroke:var(--yedge);stroke-width:3"/>';
    return '<g class="' + cls + '">' + leg(-170, -150) + leg(170, -150) + leg(-170, 170) + leg(170, 170) +
      '<rect x="-151" y="-250" width="302" height="514" rx="22" style="fill:var(--accent);stroke:var(--yedge);stroke-width:3"/>' +
      '<path d="M-120 150 L0 230 L120 150 M-120 -110 V120 M120 -110 V120" style="fill:none;stroke:var(--yedge);stroke-width:3"/>' +
      '<rect x="-70" y="-262" width="140" height="120" rx="12" style="fill:var(--ground)"/><rect x="-70" y="-262" width="140" height="120" rx="12" style="fill:rgba(0,0,0,.45)"/>' +
      '<rect x="-108" y="-130" width="216" height="336" style="fill:var(--wall);stroke:var(--main);stroke-width:8"/>' +
      '<path d="M-108 206 H108" style="stroke:var(--wall);stroke-width:10"/>' +
      '<circle class="' + cls + '-pile" cx="0" cy="10" r="0" style="fill:var(--rice)"/></g>';
  },
});
kit.scene('top', {
  init(kit) {
    const box = (x) => '<rect x="' + x + '" y="360" width="360" height="360" style="fill:var(--card);stroke:var(--second);stroke-width:3"/><path d="M' + (x + 20) + ' 380 L' + (x + 340) + ' 700 M' + (x + 340) + ' 380 L' + (x + 20) + ' 700" style="stroke:var(--second);stroke-width:1.5;opacity:.3"/>';
    const bar = (y) => '<rect x="600" y="' + y + '" width="720" height="14" rx="6" style="fill:color-mix(in srgb, var(--accent) 45%, var(--second))"/>';
    kit.stage.append(kit.h('<div class="ground">' +
      '<svg class="art top-art" viewBox="0 0 1920 1080">' +
        '<path class="dash" d="M960 0 V1080"/>' + box(312) + box(1248) +
        '<g class="top-bot" transform="translate(960 1420)">' + W.topBot('top-r') + '</g>' +
        bar(508) + bar(558) +
        '<circle cx="960" cy="540" r="108" style="fill:color-mix(in srgb, var(--second) 14%, transparent);stroke:var(--second);stroke-width:4"/>' +
        '<circle cx="960" cy="540" r="32" style="fill:none;stroke:var(--second);stroke-width:3"/>' +
        '<circle class="top-ball" cx="960" cy="540" r="50" style="fill:var(--ball);opacity:.9"/>' +
        '<circle class="top-ring" cx="960" cy="540" r="70" style="fill:none;stroke:var(--accent);stroke-width:5"/>' +
        '<g class="top-dims">' + W.dim(672, 300, 1248, 300) + '</g>' +
        '<g class="top-m">' + W.dim(672, 860, 809, 860) + W.dim(1111, 860, 1248, 860) + W.dim(809, 920, 1111, 920) + '</g></svg>' +
      '<div class="words" style="left:60px;top:40px;width:560px"><p class="step">위에서 본 모습</p><h2 class="line top-line" style="font-size:48px">로봇 폭 2배 통로 위에 호퍼를 걸친다</h2></div>' +
      '<div class="tag hot top-t1" style="left:890px;top:236px">24 cm</div>' +
      '<div class="tag top-t2" style="left:1250px;top:60px">걸침대 2개, 30 cm 이상</div>' +
      '<div class="tag top-t3" style="left:1250px;top:130px">병목을 두 걸침대 사이에 끼움</div>' +
      '<div class="tag hot top-t4" style="left:1250px;top:200px">공 들림 = 쌀이 나옴</div>' +
      '<div class="tag top-mt" style="left:300px;top:840px">여유 약 5.7 cm</div>' +
      '<div class="tag top-mt" style="left:1270px;top:840px">여유 약 5.7 cm</div>' +
      '<div class="tag top-mt" style="left:870px;top:944px">로봇 12.6 cm</div>' +
      '<div class="sheet"><div>dogistics · 호퍼 적재소</div><div>SHEET A · 위에서</div></div></div>'));
    const q = (s) => kit.stage.querySelector(s);
    this.legs = Array.from(kit.stage.querySelectorAll('.top-r-leg'));
    this.mts = Array.from(kit.stage.querySelectorAll('.top-mt'));
    Object.assign(this, { art: q('.top-art'), bot: q('.top-bot'), pile: q('.top-r-pile'), ball: q('.top-ball'), ring: q('.top-ring'), dims: q('.top-dims'), m: q('.top-m'),
      t1: q('.top-t1'), t2: q('.top-t2'), t3: q('.top-t3'), t4: q('.top-t4'), line: q('.top-line') });
  },
  render(t) {
    this.art.style.transform = 'scale(' + lerp(1, 1.015, eio(seg(t, 0, 8))) + ')';
    const y = TOP_Y(t), x = TOP_X(t), walk = (t < 3.4 || t > 5.6) ? 1 : 0;
    this.bot.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ')');
    this.legs.forEach((l, i) => { l.setAttribute('transform', 'translate(0 ' + (walk * 14 * Math.sin(t * 10 + (i === 0 || i === 3 ? 0 : Math.PI))).toFixed(1) + ')'); });
    const open = y > 540 - 206 && t > 3.9 ? 1 : 0;
    this.pile.setAttribute('r', (56 * eio(seg(t, 3.9, 5.6))).toFixed(1));
    this.ring.style.opacity = open * (0.55 + 0.45 * Math.sin(t * 5));

      '<div class="sheet"><div>dogistics · 호퍼 적재소</div><div>SHEET 4 · 수치</div></div></div>'));
    this.rows = Array.from(kit.stage.querySelectorAll('.check-r'));
    this.line = kit.stage.querySelector('.check-line');
    this.art = kit.stage.querySelector('.check-art');
  },
  render(t) {
    this.art.style.transform = 'scale(' + lerp(1, 1.02, eio(seg(t, 0, 4))) + ')';
    TextFx.fadeFromRight(this.line, t, -0.6);
    this.rows.forEach((r, i) => { const p = eo(seg(t, 0.1 + i * 0.2, 0.5 + i * 0.2)); r.style.opacity = p; r.style.transform = 'translateX(' + lerp(24, 0, p).toFixed(1) + 'px)'; });
  },
});
})();
